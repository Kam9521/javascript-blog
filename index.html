<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <header>
      <h1>My Blog</h1>
    </header>

    <div class="row">

      <!-- LEFT COLUMN - TITLES -->
      <div class="col left">
        <h2>Articles</h2>
        <ul class="titles"></ul>
      </div>

       <!-- MIDDLE COLUMN - POSTS -->
      <div class="col middle posts">

        <article id="article-1" class="post active" data-tags="cat cactus scissors" data-author="John Doe">
          <h2 class="post-title">Article 1</h2>
          <div class="post-author"></div>
          <p>This is article 1 content.</p>
          <div class="post-tags">
            <p><strong>Tags:</strong></p>
            <ul class="list list-horizontal"></ul>
          </div>
        </article>

        <article id="article-2" class="post" data-tags="design tutorials css" data-author="Anna Smith">
          <h2 class="post-title">Article 2</h2>
          <div class="post-author"></div>
          <p>This is article 2 content.</p>
          <div class="post-tags">
            <p><strong>Tags:</strong></p>
            <ul class="list list-horizontal"></ul>
          </div>
        </article>

        <article id="article-3" class="post" data-tags="html javascript blog" data-author="John Doe">
          <h2 class="post-title">Article 3</h2>
          <div class="post-author"></div>
          <p>This is article 3 content.</p>
          <div class="post-tags">
            <p><strong>Tags:</strong></p>
            <ul class="list list-horizontal"></ul>
          </div>
        </article>

      </div>

      <!-- RIGHT COLUMN - TAGS & AUTHORS -->
      <div class="col right">
        <h2>Tags</h2>
        <ul class="tags"></ul>

        <h2>Authors</h2>
        <ul class="authors"></ul>
      </div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
